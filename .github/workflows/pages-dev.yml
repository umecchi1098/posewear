name: Publish dev to Cloudflare Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# 画像とアプリの公開の間に、別の実行が割り込まないようにする。
concurrency:
  group: posewear-dev-pages
  cancel-in-progress: false

jobs:
  configuration:
    if: github.repository == 'umecchi1098/posewear' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Cloudflareの準備状況
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$ACCOUNT" && -n "$TOKEN" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### Cloudflare 準備待ち' >> "$GITHUB_STEP_SUMMARY"
            echo 'Pagesの2プロジェクトを作成後、手元の dev で python3 scripts/setup-pages.py を実行してください。今回は未公開です。' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PAGES_APP_PROJECT: ${{ vars.PAGES_APP_PROJECT }}
      PAGES_ASSET_PROJECT: ${{ vars.PAGES_ASSET_PROJECT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 公開先と本番ブランチを照合
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/pages-config.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: ビルドとアップロードの依存を用意
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/pages-cli" --no-fund --no-audit wrangler@4.166.0
          echo "$RUNNER_TEMP/pages-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/pages-assets
        with:
          library: pose
      - uses: ./.github/actions/pages-assets
        with:
          library: costume
      - uses: ./.github/actions/pages-assets
        with:
          library: anime
      - uses: ./.github/actions/pages-assets
        with:
          library: portrait

      - name: 公開用に分割ビルドしてファイルとURLを確認
        run: |
          python build.py
          python scripts/check-pages.py

      - name: 画像、本体の順で本番に公開
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 再実行した古いコミットで新しい本番を上書きしない。
          current=$(git ls-remote --exit-code origin refs/heads/dev | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::dev が更新されています。最新のコミットの実行を使用してください。"
            exit 1
          fi
          # 画像用サイトに本体の functions/ を同梱しないよう、空のディレクトリから実行する。
          mkdir -p "$RUNNER_TEMP/pages-static"
          wrangler pages deploy "$GITHUB_WORKSPACE/dist-assets" --cwd "$RUNNER_TEMP/pages-static" --project-name "$PAGES_ASSET_PROJECT" --branch dev --commit-hash "$GITHUB_SHA"
          wrangler pages deploy dist --project-name "$PAGES_APP_PROJECT" --branch dev --commit-hash "$GITHUB_SHA"

      - name: 公開URLでアプリ・素材・APIを確認
        run: |
          # 公開直後に旧版が返った場合は、配信先が更新されるまで再確認する。
          for attempt in {1..6}; do
            if python scripts/check-pages.py --live; then
              printf '公開確認済み　%s（画像 %s）\n' "$POSEWEAR_SITE" "$POSEWEAR_ASSET_HOST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then sleep 10; fi
          done
          exit 1
